name: Build SMS Organizer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project & Inject SMS Permissions
        run: |
          flutter create --org com.smart --project-name sms_organizer app_build
          cp main.dart app_build/lib/main.dart
          cd app_build
          flutter pub add flutter_sms_inbox permission_handler
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_SMS"/>' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Organizer-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          
